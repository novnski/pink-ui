[package]
name = "pink-hunk-review"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted per-hunk review band (Keep, Drop, state and the engine's refusal reason) for an agent's file edit in PINK's transcript, for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
