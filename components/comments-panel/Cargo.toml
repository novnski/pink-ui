[package]
name = "pink-comments-panel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted Comments Panel (a document's review threads in a side pane, Open and Resolved) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
