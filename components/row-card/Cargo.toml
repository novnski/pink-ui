[package]
name = "pink-row-card"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted bordered row cards with a tile, title and detail lines and trailing actions (PINK's agent and automation cards) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
