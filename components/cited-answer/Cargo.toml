[package]
name = "pink-cited-answer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted Cited Answer pieces (superscript citation numbers, the Sources column's heading and source cards, the quoted passage and the citation preview) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
