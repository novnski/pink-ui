[package]
name = "pink-place-tab"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted right-pane place tab row (PINK's place tabs, the Agents home tab and the add button) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
