[package]
name = "pink-file-badge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted file badge, its file-type well and name (PINK's tool-header file badges) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
