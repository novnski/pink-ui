[package]
name = "pink-memory-panel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted memory panel pieces (memory rows, corner actions, section headings, note strip, list and footer) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
