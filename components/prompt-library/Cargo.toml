[package]
name = "pink-prompt-library"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted prompt library pieces (saved-prompt blank counts, a template sentence with editable blank chips) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
