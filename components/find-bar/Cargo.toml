[package]
name = "pink-find-bar"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted floating find bar chrome (PINK's conversation Find) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
