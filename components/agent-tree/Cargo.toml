[package]
name = "pink-agent-tree"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted agent tree geometry (PINK's nested Agents list: indents, the activity rail and the disclosure tile) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
