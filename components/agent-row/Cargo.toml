[package]
name = "pink-agent-row"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted agent row (PINK's Agents list: status mark, title and status word over the activity and its figures) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
