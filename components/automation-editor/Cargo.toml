[package]
name = "pink-automation-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-adapted layout parts of the automation editor (PINK's scheduled-prompt form: groups, captioned fields, settings, the schedule in words and the More options disclosure) for GPUI"

# Independent boundary, like the other pink-ui packages: the gallery uses
# gpui-pre, while native hosts patch gpui to their existing runtime. No
# second GPUI enters the host graph.
[workspace]

[dependencies]
gpui = "=0.2.2"
