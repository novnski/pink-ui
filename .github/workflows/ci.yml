name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --locked
      - run: cargo test --locked
      # The browser build: the player crate compiles, and no component takes
      # its clock from std (which panics on wasm32).
      - run: cargo check --locked -p pink-ui-web --target wasm32-unknown-unknown
      - run: >-
          cargo clippy --locked --lib --target wasm32-unknown-unknown --
          -A clippy::all -D clippy::disallowed_types -D clippy::disallowed_methods
